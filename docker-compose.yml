services:
  mongo:
    image: mongo:7
    container_name: jeevansetu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - jeevansetu-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jeevansetu-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: jeevansetu_db
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "npm run start"

volumes:
  jeevansetu-mongo-data:
